[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiops-agent"
version = "0.1.0"
description = "企业级 AIOps Agent — 面向阿里云环境的智能运维代理"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AIOps Team" },
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "aiohttp>=3.9,<4.0",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "pyyaml>=6.0,<7.0",
    "alibabacloud-sts20150401>=1.0.0",
    "alibabacloud-credentials>=1.0.0",
    "alibabacloud-tea-openapi>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0,<7.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_agent"]

[project.scripts]
aiops-agent = "aiops_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.envs.default]
features = ["dev"]
